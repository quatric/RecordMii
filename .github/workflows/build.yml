name: Build

on:
  push:
    tags-ignore: [latest]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates zip
      - name: Build
        run: make
      - name: Package for Homebrew Channel
        run: |
          mkdir -p dist/apps/wiispeakrec
          cp boot-xz.dol dist/apps/wiispeakrec/boot.dol
          cp meta.xml dist/apps/wiispeakrec/
      - uses: actions/upload-artifact@v4
        with:
          name: RecordMii
          path: dist/
      - name: Zip the release
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          (cd dist && zip -r "$GITHUB_WORKSPACE/RecordMii-wii.zip" apps)
      - uses: actions/upload-artifact@v4
        with:
          name: release-RecordMii
          if-no-files-found: error
          path: |
            RecordMii-wii.zip

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-RecordMii
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RecordMii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of RecordMii from ${{ github.sha }}.

            Extract RecordMii-wii.zip to the root of your SD card (or USB drive) and open RecordMii from the Homebrew Channel.
          files: |
            out/RecordMii-wii.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: RecordMii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract RecordMii-wii.zip to the root of your SD card (or USB drive) and open RecordMii from the Homebrew Channel.
          files: |
            out/RecordMii-wii.zip
