name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates zip
      - name: Build
        run: make
      - name: Package for Homebrew Channel
        run: |
          mkdir -p dist/apps/wiispeakrec
          cp boot-xz.dol dist/apps/wiispeakrec/boot.dol
          cp meta.xml dist/apps/wiispeakrec/
      - uses: actions/upload-artifact@v4
        with:
          name: RecordMii
          path: dist/
      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: (cd dist && zip -r "$GITHUB_WORKSPACE/RecordMii-wii.zip" apps)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: RecordMii-wii.zip
